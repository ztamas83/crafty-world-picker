# Crafty Controller + Crafty World Picker.
# First run: see deploy/README.md ("Docker Compose with Crafty").

services:
  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:4.11.0
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Etc/UTC}
    ports:
      - '${CRAFTY_HTTPS_PORT:-8443}:8443' # Crafty web UI and API (HTTPS, self-signed)
      - '19132:19132/udp' # Bedrock (RakNet)
      - '19132:19132/tcp' # Bedrock (NetherNet signalling)
    volumes:
      - ./data/backups:/crafty/backups:z
      - ./data/logs:/crafty/logs:z
      - ./data/servers:/crafty/servers:z
      - ./data/config:/crafty/app/config:z
      - ./data/import:/crafty/import:z

  picker:
    # Started only after bootstrap.sh has written the token (it sets COMPOSE_PROFILES=picker in .env)
    profiles: [picker]
    build: ../..
    image: crafty-world-picker:latest
    restart: unless-stopped
    depends_on:
      - crafty
    environment:
      - CRAFTY_URL=https://crafty:8443
      - CRAFTY_SERVER_ID=${CRAFTY_SERVER_ID:-}
      - CRAFTY_API_TOKEN=${CRAFTY_API_TOKEN:-}
    ports:
      - '${PICKER_PORT:-8080}:8080'
