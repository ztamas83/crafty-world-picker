<main>
  <h1>{{ title() }}</h1>
  <ul>
    <li>Server: {{ serverName() }} {{ serverId() }}</li>
    <li>Status: {{ serverStatus().toUpperCase() }}</li>

  <section>
    <h2>Worlds</h2>
    <app-world-list />

  <section>
    <button type="button" (click)="refreshServer()">Refresh Server</button>

  </section>
</main>
