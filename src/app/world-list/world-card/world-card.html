<article class="article" [class.active]="isActive()">
  <h3>{{ world().name }}</h3>
  <div class="badge" [class.running]="isActive()">{{ world().status }}</div>
  <div>{{ world() | worldSummary }}</div>
  @if (!isActive()) {
    <button
      type="button"
      [attr.aria-label]="`Play world ${world().name}`"
      (click)="startWorld.emit(world().id)"
    >
      Play
    </button>
  }
</article>
